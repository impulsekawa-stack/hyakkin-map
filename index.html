<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e4007f">
  <title>100均マップ</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header id="topbar">
    <div id="titlerow">
      <h1>100均マップ</h1>
      <select id="radius" aria-label="検索範囲">
        <option value="1000">1km</option>
        <option value="2000" selected>2km</option>
        <option value="3000">3km</option>
        <option value="5000">5km</option>
      </select>
    </div>
    <div id="chips" role="group" aria-label="チェーンの絞り込み"></div>
  </header>

  <div id="map"></div>

  <button id="searchHere" class="floating hidden">このエリアで再検索</button>
  <button id="locate" class="fab" aria-label="現在地">◎</button>

  <section id="sheet" class="collapsed">
    <button id="sheetHandle" aria-label="一覧を開閉">
      <span class="grip"></span>
      <span id="status">現在地を取得しています…</span>
    </button>
    <ul id="list"></ul>
  </section>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
